[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "4.1.0"
description = "3D CG Rendering & Neural Video Generation Interoperability Hub & Hybrid Cinema Pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "Apache-2.0" }
authors = [
    { name = "sautille-stroke", email = "dev@dervgen.org" },
]
keywords = [
    "rendering", "video-generation", "interoperability", "3d", "cg",
    "hybrid-rendering", "diffusion", "fgpp", "benchmark"
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "pytest-xdist",
    "pytest-timeout>=2.2.0",
    "ruff",
    "mypy",
    "pybind11>=2.12.0",
    "hypothesis>=6.100.0",
    "jsonschema>=4.21.0",
]
image = [
    "opencv-python-headless>=4.8.0",
    "pillow>=9.5.0",
    "openexr>=3.2.0",
]
metrics = [
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
]
gpu = [
    "torch>=2.0.0",
    "diffusers>=0.30.0",
    "accelerate>=0.33.0",
    "transformers>=4.44.0",
    "huggingface_hub>=0.24.0",
    "torchvision",
]
mesh = [
    "trimesh>=4.0.0",
]
invrender = [
    "mitsuba>=3.5.0",
    "drjit>=0.4.5",
]
jit = [
    "numba>=0.58.0",
]
train = [
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
    "webdataset>=0.2.86",
]
full = [
    "synapse[image,metrics,gpu,mesh,invrender,jit,train,dev]",
]

[project.scripts]
synapse = "synapse.cli:main_synapse"
synapse-bench = "synapse.cli:main_bench"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
synapse = ["py.typed", "bench/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "python"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "external_data: marks tests requiring external sibling repos or pre-exported datasets",
    "platform_specific: marks tests restricted to specific operating systems",
]

[tool.mypy]
python_version = "3.12"
strict = true
mypy_path = ["python"]
explicit_package_bases = true
files = ["python/synapse", "tests", "scripts", "tools"]
exclude = ["bazel-.*", ".*\\.runfiles", "\\.pytest_tmp", "tools/data-inspector"]

[[tool.mypy.overrides]]
module = [
    "OpenEXR",
    "Imath",
    "cv2",
    "trimesh",
    "trimesh.*",
    "mitsuba",
    "mitsuba.*",
    "drjit",
    "drjit.*",
    "numba",
    "numba.*",
    "safetensors",
    "safetensors.*",
    "yaml",
    "scipy",
    "scipy.*",
    "pybind11",
    "pybind11.*",
    "aether_geo",
    "aether_geo.*",
    "aether.color",
    "aether.color.*",
    "aether.metrics",
    "aether.metrics.*",
    "huggingface_hub",
    "huggingface_hub.*",
    "accelerate",
    "accelerate.*",
    "diffusers",
    "diffusers.*",
    "torchvision",
    "torchvision.*",
    "transformers",
    "transformers.*",
]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100
exclude = ["._*"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B", "SIM", "RUF", "W", "PT", "S108", "S202", "S301", "S310", "S602", "S603"]
ignore = [
    "E712",
    "B007", "B009", "B010",
    "SIM102", "SIM105", "SIM108", "SIM117", "SIM118", "SIM300",
    "UP006", "UP007", "UP015", "UP035",
    "RUF001", "RUF002", "RUF003", "RUF005", "RUF015", "RUF022", "RUF043", "RUF046", "RUF059",
]

[tool.ruff.lint.per-file-ignores]
"scripts/*" = ["E402", "S603"]
"tests/*" = ["S108", "S301", "S310", "S602", "S603", "PT004", "PT011", "PT012", "PT018"]
"tools/*" = ["S310"]
"python/synapse/*" = ["S310"]
