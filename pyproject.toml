[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "synapse"
version = "0.1.0"
description = "3D CG Rendering & Neural Video Generation Interoperability Hub & Hybrid Cinema Pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "sautille-stroke", email = "dev@dervgen.org" },
]
keywords = [
    "rendering", "video-generation", "interoperability", "3d", "cg",
    "hybrid-rendering", "diffusion", "fgpp", "benchmark"
]
dependencies = [
    "numpy>=1.24.0",
    "pydantic>=2.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio",
    "ruff",
    "mypy",
]
image = [
    "opencv-python-headless>=4.8.0",
    "pillow>=9.5.0",
    "openexr>=3.2.0",
]
metrics = [
    "scipy>=1.10.0",
    "scikit-image>=0.20.0",
]
gpu = [
    "torch>=2.0.0",
]
mesh = [
    "trimesh>=4.0.0",
]
jit = [
    "numba>=0.58.0",
]
train = [
    "safetensors>=0.4.0",
    "pyyaml>=6.0",
]
full = [
    "synapse[image,metrics,gpu,mesh,jit,train,dev]",
]

[project.scripts]
synapse = "synapse.cli:main_synapse"
synapse-bench = "synapse.cli:main_bench"

[tool.setuptools.packages.find]
where = ["python"]

[tool.setuptools.package-data]
synapse = ["py.typed", "bench/scenarios/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
asyncio_mode = "auto"
addopts = "--basetemp=./.pytest_tmp"

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.ruff]
target-version = "py310"
line-length = 100
