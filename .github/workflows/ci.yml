# Synapse CI — Horizon 11 Quality Baseline
# Automated gate for lint, strict types, wire/DAG guards, pytest fast/slow,
# native Bazel extensions, Electron Data Inspector SHM, and doc links.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Python fast checks (ruff, mypy, guards, pytest -m 'not slow')
  # -----------------------------------------------------------------------
  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AETHER_ROOT: ${{ github.workspace }}/aether
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Fallback aether checkout notice
        if: steps.checkout-aether.outcome != 'success'
        run: |
          echo "::warning::dervgen/aether checkout skipped (private repo requires DERVGEN_PAT secret). Running in pure-Python Oracle mode."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bazel (when aether is available)
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-pyfast
          repository-cache: ${{ github.workflow }}-pyfast

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libopenexr-dev ffmpeg

      - name: Install dependencies
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,image,metrics,train,mesh]"
          pip install aether-traceboard>=0.1.0

      - name: Build native extensions (aether_geo + aether_metrics)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python scripts/build_native.py --backend=auto

      - name: Ruff lint
        working-directory: synapse
        run: ruff check python/ tests/ scripts/ tools/

      - name: Mypy strict (207+ source files)
        working-directory: synapse
        run: |
          set +e
          OUTPUT=$(mypy --strict python/synapse tests/ scripts/ tools/ 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          CHECKED=$(echo "$OUTPUT" | grep -oP '(?:checked |in )\K[0-9]+(?= source files)' || true)
          if [ -z "$CHECKED" ] || [ "$CHECKED" -lt 207 ]; then
            echo "ERROR: Only checked ${CHECKED:-0} files, expected >= 207"
            exit 1
          fi
          test $RC -eq 0

      - name: Wire guard (with aether header parity)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python tools/wire_guard.py --check --require-aether

      - name: Wire guard (internal + JSON schemas)
        if: steps.checkout-aether.outcome != 'success'
        working-directory: synapse
        run: python tools/wire_guard.py --check

      - name: Import DAG guard
        working-directory: synapse
        run: python tools/import_dag_guard.py --check

      - name: Pytest (fast)
        working-directory: synapse
        env:
          SYNAPSE_CI_STRICT_DEPS: "1"
        run: pytest tests/ -m 'not slow' -q -W error::scipy.linalg.LinAlgWarning

  # -----------------------------------------------------------------------
  # Job 2: Python slow tests (parallelized)
  # -----------------------------------------------------------------------
  python-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNAPSE_CI_STRICT_DEPS: "1"
      AETHER_ROOT: ${{ github.workspace }}/aether
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bazel (when aether is available)
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-pyslow
          repository-cache: ${{ github.workflow }}-pyslow

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libopenexr-dev ffmpeg

      - name: Install dependencies
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,image,metrics,train,mesh]"

      - name: Build native extensions (aether_geo + aether_metrics)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python scripts/build_native.py --backend=auto

      - name: Pytest (slow, parallel)
        working-directory: synapse
        run: pytest tests/ -m slow -n auto -q

  # -----------------------------------------------------------------------
  # Job 3: Native C++20 geometry core + Data Inspector Bazel tests
  # -----------------------------------------------------------------------
  native-bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Skip notice when private dervgen/aether is unavailable
        if: steps.checkout-aether.outcome != 'success'
        run: |
          echo "::warning::dervgen/aether unavailable (configure DERVGEN_PAT secret). Skipping C++ Bazel targets in public runner."

      - name: Install Bazel
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: ${{ github.workflow }}

      - name: Test aether geo and python bindings
        if: steps.checkout-aether.outcome == 'success'
        working-directory: aether
        run: bazel test //geo:all //python:all --config=opt

      - name: Test data-inspector native
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse/tools/data-inspector/native
        run: bazel test //... --config=opt

  # -----------------------------------------------------------------------
  # Job 4: Electron Data Inspector bundle loading
  # -----------------------------------------------------------------------
  electron-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Install Bazel
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: ${{ github.workflow }}

      - name: Build data-inspector native
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse/tools/data-inspector/native
        run: bazel build //:data-inspector-native --config=opt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron dependencies
        working-directory: synapse/tools/data-inspector
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-package-lock

      - name: Bundle loading test
        working-directory: synapse
        env:
          SYNAPSE_ALLOW_MISSING_NATIVE_BIN: ${{ steps.checkout-aether.outcome == 'success' && '0' || '1' }}
        run: |
          node tools/data-inspector/test/test-bundle-loading.js
          # Ensure no files were dirtied
          test -z "$(git status --porcelain)"

  # -----------------------------------------------------------------------
  # Job 5: Markdown link check & benchmark timing gate
  # -----------------------------------------------------------------------
  docs-and-bench-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Markdown broken-link scan
        working-directory: synapse
        run: python scripts/check_doc_links.py

      - name: Benchmark timing gate
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          timeout 120 pytest tests/test_bench.py -k "test_scenario_create" -v --timeout=60
