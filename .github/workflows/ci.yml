# Synapse CI — Horizon 11 Quality Baseline
# Automated gate for lint, strict types, wire/DAG guards, pytest fast/slow,
# native Bazel extensions, Electron Data Inspector SHM, and doc links.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  # -----------------------------------------------------------------------
  # Job 1: Python fast checks (ruff, mypy, guards, pytest -m 'not slow')
  # -----------------------------------------------------------------------
  python-fast:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AETHER_ROOT: ${{ github.workspace }}/aether
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Fallback aether checkout notice
        if: steps.checkout-aether.outcome != 'success'
        run: |
          echo "::warning::dervgen/aether checkout skipped (private repo requires DERVGEN_PAT secret). Running in pure-Python Oracle mode."

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bazel (when aether is available)
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-pyfast
          repository-cache: ${{ github.workflow }}-pyfast

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libopenexr-dev ffmpeg

      - name: Install dependencies
        id: install-deps
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,image,metrics,train,mesh]"
          if [ -d "../aether/traceboard/python" ]; then
            pip install -e ../aether/traceboard/python
          else
            pip install "aether-traceboard>=0.1.0" || echo "::warning::aether-traceboard unavailable from PyPI; verifying graceful-degradation path."
          fi
          if python -c "import aether_traceboard" 2>/dev/null; then
            echo "has_tb=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tb=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native extensions (aether_geo + aether_metrics)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python scripts/build_native.py --backend=auto

      - name: Ruff lint
        working-directory: synapse
        run: ruff check python/ tests/ scripts/ tools/

      - name: Mypy strict (207+ source files)
        working-directory: synapse
        run: |
          set +e
          OUTPUT=$(mypy --strict python/synapse tests/ scripts/ tools/ 2>&1)
          RC=$?
          set -e
          echo "$OUTPUT"
          CHECKED=$(echo "$OUTPUT" | grep -oP '(?:checked |in )\K[0-9]+(?= source files)' || true)
          if [ -z "$CHECKED" ] || [ "$CHECKED" -lt 207 ]; then
            echo "ERROR: Only checked ${CHECKED:-0} files, expected >= 207"
            exit 1
          fi
          test $RC -eq 0

      - name: Wire guard (with aether header parity)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python tools/wire_guard.py --check --require-aether

      - name: Wire guard (internal + JSON schemas)
        if: steps.checkout-aether.outcome != 'success'
        working-directory: synapse
        run: python tools/wire_guard.py --check

      - name: Import DAG guard
        working-directory: synapse
        run: python tools/import_dag_guard.py --check

      - name: Pytest (fast)
        working-directory: synapse
        env:
          SYNAPSE_CI_STRICT_DEPS: "1"
        run: pytest tests/ -m 'not slow' -q -W error::scipy.linalg.LinAlgWarning

      - name: Traceboard real SDK CLI smoke & binary verification
        if: steps.install-deps.outputs.has_tb == 'true'
        id: tb_smoke
        working-directory: synapse
        env:
          SYNAPSE_CI_STRICT_DEPS: "1"
        run: |
          pytest tests/test_observability.py tests/test_traceboard_export.py tests/test_bench_runner_traceboard.py tests/test_pr07_rich_media_and_worker.py tests/test_training_traceboard.py tests/test_rsi_recon_traceboard.py tests/test_adapters_style_traceboard.py -v
          mkdir -p "$RUNNER_TEMP/tb_smoke"
          synapse bench run \
            --scenario t1_rigid_cube_orbit \
            --adapter mock \
            --resolution 64 \
            --json \
            --traceboard "$RUNNER_TEMP/tb_smoke"
          python -c '
          from pathlib import Path
          import sys
          from aether_traceboard._types import EventType, StageStatus
          from aether_traceboard.event import unpack_run_end, unpack_stage_end
          from aether_traceboard.reader import read_file
          files = list(Path(sys.argv[1]).glob("*.tbevt"))
          assert len(files) == 1, f"Expected 1 .tbevt file, got {files}"
          hdr, recs, stats = read_file(files[0])
          assert stats.crc_errors == 0, f"CRC errors: {stats.crc_errors}"
          assert not stats.truncated_tail
          assert stats.valid_records >= 5
          types = [r.event_type for r in recs]
          assert types[0] == EventType.RUN_START
          assert types[-1] == EventType.RUN_END
          assert unpack_run_end(recs[-1].payload) == "finished"
          stage_ends = [r for r in recs if r.event_type == EventType.STAGE_END]
          assert len(stage_ends) >= 1
          for se in stage_ends:
              _, meta = unpack_stage_end(se.payload)
              assert meta is not None and meta["status"] == int(StageStatus.PASS)
          scalar_tags = {r.tag for r in recs if r.event_type == EventType.SCALAR}
          assert "bench/scenario/t1_rigid_cube_orbit/passed" in scalar_tags
          assert any(t.startswith("bench/scenario/t1_rigid_cube_orbit/metrics/") for t in scalar_tags)
          print(f"Verified {files[0].name}: {stats.valid_records} valid records")
          ' "$RUNNER_TEMP/tb_smoke"

      - name: Upload Traceboard CI smoke artifact
        if: steps.install-deps.outputs.has_tb == 'true' && always()
        uses: actions/upload-artifact@v4
        with:
          name: ci-traceboard-smoke-tbevt
          path: ${{ runner.temp }}/tb_smoke/*.tbevt
          if-no-files-found: ignore

      - name: Traceboard smoke skipped notice
        if: steps.install-deps.outputs.has_tb != 'true'
        run: |
          echo "::notice::Traceboard real SDK smoke skipped because aether-traceboard is unavailable in this environment."

  # -----------------------------------------------------------------------
  # Job 2: Python slow tests (parallelized)
  # -----------------------------------------------------------------------
  python-slow:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      SYNAPSE_CI_STRICT_DEPS: "1"
      AETHER_ROOT: ${{ github.workspace }}/aether
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install Bazel (when aether is available)
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}-pyslow
          repository-cache: ${{ github.workflow }}-pyslow

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libgl1 libopenexr-dev ffmpeg

      - name: Install dependencies
        id: install-deps
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install torch --index-url https://download.pytorch.org/whl/cpu
          pip install -e ".[dev,image,metrics,train,mesh]"
          if [ -d "../aether/traceboard/python" ]; then
            pip install -e ../aether/traceboard/python
          else
            pip install "aether-traceboard>=0.1.0" || echo "::warning::aether-traceboard unavailable from PyPI; verifying graceful-degradation path."
          fi
          if python -c "import aether_traceboard" 2>/dev/null; then
            echo "has_tb=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tb=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Build native extensions (aether_geo + aether_metrics)
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse
        run: python scripts/build_native.py --backend=auto

      - name: Pytest (slow, parallel)
        working-directory: synapse
        run: pytest tests/ -m slow -n auto -q

  # -----------------------------------------------------------------------
  # Job 3: Native C++20 geometry core + Data Inspector Bazel tests
  # -----------------------------------------------------------------------
  native-bazel:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Skip notice when private dervgen/aether is unavailable
        if: steps.checkout-aether.outcome != 'success'
        run: |
          echo "::warning::dervgen/aether unavailable (configure DERVGEN_PAT secret). Skipping C++ Bazel targets in public runner."

      - name: Install Bazel
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: ${{ github.workflow }}

      - name: Test aether geo and python bindings
        if: steps.checkout-aether.outcome == 'success'
        working-directory: aether
        run: bazel test //geo:all //python:all --config=opt

      - name: Test data-inspector native
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse/tools/data-inspector/native
        run: bazel test //... --config=opt

  # -----------------------------------------------------------------------
  # Job 4: Electron Data Inspector bundle loading
  # -----------------------------------------------------------------------
  electron-inspector:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Checkout dervgen/aether (sibling)
        id: checkout-aether
        uses: actions/checkout@v4
        with:
          repository: dervgen/aether
          path: aether
          token: ${{ secrets.DERVGEN_PAT || github.token }}
        continue-on-error: true

      - name: Install Bazel
        if: steps.checkout-aether.outcome == 'success'
        uses: bazel-contrib/setup-bazel@0.14.0
        with:
          bazelisk-cache: true
          disk-cache: ${{ github.workflow }}
          repository-cache: ${{ github.workflow }}

      - name: Build data-inspector native
        if: steps.checkout-aether.outcome == 'success'
        working-directory: synapse/tools/data-inspector/native
        run: bazel build //:data-inspector-native --config=opt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Electron dependencies
        working-directory: synapse/tools/data-inspector
        run: npm ci --ignore-scripts || npm install --ignore-scripts --no-package-lock

      - name: Bundle loading test
        working-directory: synapse
        env:
          SYNAPSE_ALLOW_MISSING_NATIVE_BIN: ${{ steps.checkout-aether.outcome == 'success' && '0' || '1' }}
        run: |
          node tools/data-inspector/test/test-bundle-loading.js
          # Ensure no files were dirtied
          test -z "$(git status --porcelain)"

  # -----------------------------------------------------------------------
  # Job 5: Markdown link check & benchmark timing gate
  # -----------------------------------------------------------------------
  docs-and-bench-gate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          path: synapse

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Markdown broken-link scan
        working-directory: synapse
        run: python scripts/check_doc_links.py

      - name: Benchmark timing gate
        working-directory: synapse
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          timeout 120 pytest tests/test_bench.py -k "test_scenario_create" -v --timeout=60
